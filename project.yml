name: Reader
options:
  bundleIdPrefix: com.reader
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  SWIFT_STRICT_CONCURRENCY: minimal
packages:
  ReaderCore:
    path: Packages/ReaderCore
  ReaderKokoro:
    path: Packages/ReaderKokoro
targets:
  Reader:
    type: application
    platform: macOS
    sources:
      - path: App/Reader
        excludes:
          - Info.plist
          - Reader.entitlements
    dependencies:
      - package: ReaderCore
        product: ReaderCore
      - package: ReaderKokoro
        product: ReaderKokoro
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.reader.Reader
      PRODUCT_NAME: Reader
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: App/Reader/Info.plist
      CODE_SIGN_ENTITLEMENTS: App/Reader/Reader.entitlements
      ENABLE_APP_SANDBOX: NO
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      SWIFT_OBJC_BRIDGING_HEADER: App/Reader/Reader-Bridging-Header.h
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
schemes:
  Reader:
    build:
      targets:
        Reader: all
    run:
      config: Debug
