# Highlight smoke for Reader QA.
# Android application id: com.reader
#
# longPressOn points are the visible "Ishmael" glyphs on the sample book at
# 1080x2400 after v1 chrome (helper line removed): "28%,20%" on PDF page 1,
# "28%,28%" on the sample EPUB. Wait for reader-position so the text layer
# is hit-testable before the long press.
# The sheet is dismissed by Remove (no bottom Close button).
# Selectors: library-pdf, library-epub, reader-surface, highlight-sheet,
# highlight-color-1 … highlight-color-6, remove-highlight, reader-library.
appId: com.reader
---
- launchApp
- assertVisible:
    id: library-pdf
- tapOn:
    id: library-pdf
- extendedWaitUntil:
    visible:
      id: reader-surface
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: reader-position
    timeout: 15000
- longPressOn:
    point: "28%,20%"
- extendedWaitUntil:
    visible:
      id: highlight-sheet
    timeout: 10000
- tapOn:
    id: highlight-color-2
- tapOn:
    id: remove-highlight
- assertNotVisible:
    id: highlight-sheet
- tapOn:
    id: reader-library
- assertVisible:
    id: library-epub
- tapOn:
    id: library-epub
- extendedWaitUntil:
    visible:
      id: reader-surface
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: reader-position
    timeout: 15000
- longPressOn:
    point: "28%,28%"
- extendedWaitUntil:
    visible:
      id: highlight-sheet
    timeout: 10000
- tapOn:
    id: highlight-color-3
- tapOn:
    id: remove-highlight
- assertNotVisible:
    id: highlight-sheet
- tapOn:
    id: reader-library
- assertVisible:
    id: library-pdf
